plugins {
    id 'java'
}

group = 'org.key-project'
version = '2.12.4-smartML'

configurations { antlr4 }

repositories {
    mavenCentral()
}

dependencies {

    implementation project(":key.ncore")
    implementation project(":key.ncore.calculus")
    antlr4 "org.antlr:antlr4:4.13.2"
    api "org.antlr:antlr4-runtime:4.13.2"

    implementation 'org.jspecify:jspecify:1.0.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

def antlr4OutputKey = String.valueOf(projectDir) + '/build/generated-src/antlr/main/de/tu_darmstadt/smartml/parser'

sourceSets.main.java.srcDirs(String.valueOf(projectDir) + '/build/generated-src/antlr/main/')

tasks.register('runAntlr4Key', JavaExec) {
    //see incremental task api, prevents rerun if nothing has changed.
    inputs.files "src/main/antlr/de/tu_darmstadt/smartml/parser/KeYSmartMLDLLexer.g4", "src/main/antlr/de/tu_darmstadt/smartml/parser/KeYSmartMLDLParser.g4"
    outputs.dir antlr4OutputKey
    classpath = configurations.antlr4
    mainClass.set("org.antlr.v4.Tool")
    args = ["-visitor",
            "-lib", "../key.ncore/src/main/antlr/",
            "-Xexact-output-dir", "-o", antlr4OutputKey,
            "src/main/antlr/de/tu_darmstadt/smartml/parser/KeYSmartMLDLLexer.g4", "src/main/antlr/de/tu_darmstadt/smartml/parser/KeYSmartMLDLParser.g4"]
    doFirst {
        file(antlr4OutputKey).mkdirs()
        println("create $antlr4OutputKey")
    }
}
compileJava.dependsOn runAntlr4Key

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    enableAssertions = true
}

checkerFramework {
    if(System.getProperty("ENABLE_NULLNESS")) {
        checkers = [
                "org.checkerframework.checker.nullness.NullnessChecker",
        ]
        extraJavacArgs = [
                "-AonlyDefs=^de\\.tu_darmstadt\\.smartml\\.parser\\.builder",
                "-Xmaxerrs", "10000",
                "-Astubs=$rootDir/key.util/src/main/checkerframework:permit-nullness-assertion-exception.astub",
                "-AstubNoWarnIfNotFound",
                "-Werror",
                "-Aversion",
        ]
    }
}
